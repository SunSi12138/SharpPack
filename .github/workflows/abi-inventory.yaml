name: ABI-Inventory
on:
  push:
    branches: [validation/issue17-abi-inventory-20261105, validation/issue17-scoped-perf-20261105]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Capture candidate scoped contracts for independent review
        run: dotnet run --project tools/SharpPack.Baselines -c Release -- update
      - name: Export candidate scoped baseline
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = 'eng/baselines/generated/runtime-dependencies.txt'
          encoded = base64.b64encode(Path(path).read_bytes()).decode()
          print('BASELINE_START ' + path)
          for offset in range(0, len(encoded), 3000):
              print('BASELINE_DATA ' + encoded[offset:offset + 3000])
          print('BASELINE_END ' + path)
          PY
