name: ABI-Inventory
on:
  push:
    branches: [validation/issue17-abi-inventory-20261105, validation/issue17-scoped-perf-20261105, validation/issue17-flat-exact-20261105]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify reviewed semantic and public baselines
        run: dotnet run --project tools/SharpPack.Baselines -c Release -- verify
      - name: Verify clean tracked tree
        run: git diff --exit-code
