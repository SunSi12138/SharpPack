name: Package-Consumers
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - validation/issue18-streaming-lockstep-20261104
      - validation/issue18-continuous-gates-20261105
  pull_request:
    branches:
      - main
      - dev
jobs:
  package-consumers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: X64
          - runner: ubuntu-24.04-arm
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.114
      - name: Verify lockstep parser failure modes
        run: python3 tools/PackageConsumers/test_lockstep.py
      - name: Real nupkg consumers, isolated Roslyn hosts and AOT
        run: python3 tools/PackageConsumers/verify.py --aot --architecture ${{ matrix.architecture }}
      - name: Verify clean tracked tree
        if: always()
        run: git diff --exit-code
