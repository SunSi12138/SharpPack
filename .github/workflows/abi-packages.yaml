name: Generated ABI packages

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/abi-packages.yaml'
      - 'tools/AbiCompatibility/**'
      - 'src/SharpPack*/**'
      - 'Directory.Build.props'
      - 'global.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python3 tools/AbiCompatibility/verify.py
      - run: git diff --exit-code
