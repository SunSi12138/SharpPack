name: Build-Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build-dotnet:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet run --project sandbox/CollectibleAlcSample -c Release
      - run: dotnet pack -c Release --no-build -o "$GITHUB_WORKSPACE/artifacts"
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/sharppack-aot"
      - run: '"$RUNNER_TEMP/sharppack-aot/NativeAot"'
      - run: dotnet list SharpPack.sln package --vulnerable --include-transitive
      - run: git diff --exit-code
