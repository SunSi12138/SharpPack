name: Build-Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build-dotnet:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          fetch-depth: 0
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:IncludeSymbols=true -o "$GITHUB_WORKSPACE/artifacts"
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/memorypack-aot"
      - run: '"$RUNNER_TEMP/memorypack-aot/NativeAot"'
      - run: dotnet list MemoryPack.sln package --vulnerable --include-transitive
      - run: git diff --exit-code
