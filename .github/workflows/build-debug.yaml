name: Build-Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "codex/issue-9-api-generated-baselines"
  pull_request:
    branches:
      - "main"
      - "dev"

jobs:
  build-dotnet:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - name: Bootstrap architecture baselines
        run: |
          dotnet run --project tools/SharpPack.Baselines/SharpPack.Baselines.csproj -c Release -- update
          for file in \
            eng/baselines/public-api/SharpPack.Core.txt \
            eng/baselines/public-api/SharpPack.Streaming.txt \
            eng/baselines/generated/representative.g.cs.txt
          do
            echo "BASELINE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "BASELINE_END:$file"
          done
          exit 1
      - run: dotnet test -c Release --no-build
      - run: dotnet run --project sandbox/CollectibleAlcSample -c Release
      - run: dotnet pack -c Release --no-build -o "$GITHUB_WORKSPACE/artifacts"
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/sharppack-aot"
      - run: '"$RUNNER_TEMP/sharppack-aot/NativeAot"'
      - run: dotnet list SharpPack.sln package --vulnerable --include-transitive
      - run: git diff --exit-code
