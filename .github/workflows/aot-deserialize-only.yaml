name: AOT deserialize-only characterization
on:
  push:
    branches: [fix/issue31-deserialization-roots]
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/aot-deserialize-only.yaml'
      - 'sandbox/DeserializeOnlyAot/**'
      - 'sandbox/DeserializeOnlyAot.Contracts/**'
      - 'tools/SharpPack.FactoryMetadata/**'
      - 'src/**'
  workflow_dispatch:
jobs:
  deserialize-only:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [production]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Select merged baseline sources for performance comparison
        if: matrix.runner == 'ubuntu-24.04'
        run: git restore --source=6666ada1d878da64b2f4d2c1107fbea30fad074f -- src
      - name: Publish baseline for scoped read-only performance comparison
        if: matrix.runner == 'ubuntu-24.04'
        run: dotnet publish sandbox/DeserializeOnlyAot -c Release -p:DefineConstants=BASELINE_COMPARISON -o "$RUNNER_TEMP/baseline-read-only"
      - name: Restore exact candidate sources
        if: matrix.runner == 'ubuntu-24.04'
        run: git restore --source=HEAD -- src
      - name: Publish isolated consumer
        run: |
          set -o pipefail
          dotnet publish sandbox/DeserializeOnlyAot -c Release -o "$RUNNER_TEMP/deserialize-only" 2>&1 | tee "$RUNNER_TEMP/deserialize-only-publish.txt"
          if grep -q 'IL2111' "$RUNNER_TEMP/deserialize-only-publish.txt"; then exit 1; fi
      - name: Inspect emitted factory metadata without rooting consumer methods
        run: dotnet run --project tools/SharpPack.FactoryMetadata -c Release -- sandbox/DeserializeOnlyAot/bin/Release/net10.0/${{ matrix.runner == 'ubuntu-24.04-arm' && 'linux-arm64' || 'linux-x64' }}/DeserializeOnlyAot.dll
      - name: Run isolated consumer
        run: '"$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"'
      - name: Report native executable size
        if: always()
        run: stat -c '%n %s bytes' "$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"
      - name: Publish and execute original NativeAOT regression sample
        run: |
          set -o pipefail
          dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/original-aot" 2>&1 | tee "$RUNNER_TEMP/original-aot-publish.txt"
          if grep -q 'IL2111' "$RUNNER_TEMP/original-aot-publish.txt"; then exit 1; fi
          "$RUNNER_TEMP/original-aot/NativeAot"
      - name: Publish matching-corpus candidate performance binary
        if: matrix.runner == 'ubuntu-24.04'
        run: dotnet publish sandbox/DeserializeOnlyAot -c Release -p:DefineConstants=BASELINE_COMPARISON -o "$RUNNER_TEMP/candidate-read-only"
      - name: Compare warmed read-only paths in ABBA process order
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          for variant in baseline-read-only candidate-read-only candidate-read-only baseline-read-only; do
            echo "PERF_PROCESS $variant"
            "$RUNNER_TEMP/$variant/DeserializeOnlyAot" --performance
          done
          stat -c '%n %s bytes' "$RUNNER_TEMP/baseline-read-only/DeserializeOnlyAot" "$RUNNER_TEMP/candidate-read-only/DeserializeOnlyAot"
      - name: Publish explicitly rooted trimming positive control
        run: dotnet publish sandbox/DeserializeOnlyAot -c Release -p:DefineConstants=FACTORY_ROOT_POSITIVE_CONTROL -o "$RUNNER_TEMP/positive-control"
      - name: Verify native method trimming with an executed positive control
        run: |
          set -o pipefail
          "$RUNNER_TEMP/positive-control/DeserializeOnlyAot" | tee "$RUNNER_TEMP/positive-output.txt"
          grep -q 'SHARPPACK_UNUSED_PRIVATE_METHOD_SHOULD_BE_TRIMMED_31' "$RUNNER_TEMP/positive-output.txt"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def methods(variant):
              executable = root / variant / 'DeserializeOnlyAot'
              symbols = Path(str(executable) + '.dbg')
              text = subprocess.check_output(['nm', '-a', str(symbols)], text=True)
              return [line for line in text.splitlines()
                      if 'UnusedPrivateMethod' in line and len(line.split()) >= 3
                      and line.split()[1] in ('t', 'T')]
          negative = methods('deserialize-only')
          positive = methods('positive-control')
          print('Negative private method symbols:', negative)
          print('Positive private method symbols:', positive)
          assert not negative, 'Unused private method native code was over-preserved'
          assert positive, 'Executed non-inlined positive control has no native method symbol'
          print('Unused private method trimming control passed.')
          PY
      - name: Verify trimmed JIT consumer compatibility
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          dotnet publish sandbox/DeserializeOnlyAot -c Release -p:SharpPackTrimmedJit=true --self-contained true -r linux-x64 -o "$RUNNER_TEMP/trimmed-jit"
          "$RUNNER_TEMP/trimmed-jit/DeserializeOnlyAot"
      - name: Verify the candidate source tree stayed unchanged
        run: git diff --exit-code

