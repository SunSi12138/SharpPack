name: AOT deserialize-only characterization
on:
  push:
    branches: [fix/issue31-deserialization-roots]
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/aot-deserialize-only.yaml'
      - 'sandbox/DeserializeOnlyAot/**'
      - 'src/**'
  workflow_dispatch:
jobs:
  deserialize-only:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        variant: [baseline, no-annotations, interface-roots, constructor-roots]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply isolated root-preservation candidate
        run: python3 tools/characterize-aot-roots.py '${{ matrix.variant }}'
      - name: Publish isolated consumer
        run: dotnet publish sandbox/DeserializeOnlyAot -c Release -o "$RUNNER_TEMP/deserialize-only"
      - name: Run isolated consumer
        run: '"$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"'
      - name: Report native executable size
        if: always()
        run: stat -c '%n %s bytes' "$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"
