name: AOT deserialize-only characterization
on:
  push:
    branches: [fix/issue31-deserialization-roots]
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/aot-deserialize-only.yaml'
      - 'sandbox/DeserializeOnlyAot/**'
      - 'src/**'
  workflow_dispatch:
jobs:
  deserialize-only:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [precise-constructors]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish baseline for scoped read-only performance comparison
        if: matrix.runner == 'ubuntu-24.04'
        run: dotnet publish sandbox/DeserializeOnlyAot -c Release -o "$RUNNER_TEMP/baseline-read-only"
      - name: Apply isolated root-preservation candidate
        run: python3 tools/characterize-aot-roots.py '${{ matrix.variant }}'
      - name: Publish isolated consumer
        run: |
          set -o pipefail
          dotnet publish sandbox/DeserializeOnlyAot -c Release -o "$RUNNER_TEMP/deserialize-only" 2>&1 | tee "$RUNNER_TEMP/deserialize-only-publish.txt"
          if grep -q 'IL2111' "$RUNNER_TEMP/deserialize-only-publish.txt"; then exit 1; fi
      - name: Run isolated consumer
        run: '"$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"'
      - name: Report native executable size
        if: always()
        run: stat -c '%n %s bytes' "$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"
      - name: Publish and execute original NativeAOT regression sample
        run: |
          set -o pipefail
          dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/original-aot" 2>&1 | tee "$RUNNER_TEMP/original-aot-publish.txt"
          if grep -q 'IL2111' "$RUNNER_TEMP/original-aot-publish.txt"; then exit 1; fi
          "$RUNNER_TEMP/original-aot/NativeAot"
      - name: Compare warmed read-only paths in ABBA process order
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          for variant in baseline-read-only deserialize-only deserialize-only baseline-read-only; do
            echo "PERF_PROCESS $variant"
            "$RUNNER_TEMP/$variant/DeserializeOnlyAot" --performance
          done
          stat -c '%n %s bytes' "$RUNNER_TEMP/baseline-read-only/DeserializeOnlyAot" "$RUNNER_TEMP/deserialize-only/DeserializeOnlyAot"
