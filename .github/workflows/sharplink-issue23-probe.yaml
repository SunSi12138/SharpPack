name: SharpLink shared formatter validation

on:
  push:
    branches: [validation/issue23-sharplink]

permissions:
  contents: read

jobs:
  routed-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SHARPPACK_VERSION: 2.0.0-wireid.1
      SHARPLINK_VERSION: 3.0.0-wireid.1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/checkout@v7
        with:
          repository: SunSi12138/SharpLink
          ref: 2948de82fff77d66fce51ecec9a5783b6ef3cb62
          path: sharplink-probe
          persist-credentials: false
      - name: Build a private candidate feed and apply the adapter probe
        run: |
          feed="$RUNNER_TEMP/probe-feed"
          echo "PROBE_FEED=$feed" >> "$GITHUB_ENV"
          dotnet build src/SharpPack/SharpPack.csproj -c Release -p:Version="$SHARPPACK_VERSION"
          dotnet build src/SharpPack.Streaming/SharpPack.Streaming.csproj -c Release -p:Version="$SHARPPACK_VERSION"
          bash tools/PackageConsumers/pack.sh "$SHARPPACK_VERSION" "$feed"
          git -C sharplink-probe apply --index "$GITHUB_WORKSPACE/eng/validation/sharplink-issue23.patch"
      - name: Verify SharpLink codec identity, cross-build wire, routing and diagnostics
        working-directory: sharplink-probe
        run: |
          project=test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj
          dotnet build "$project" -c Release -p:RestoreAdditionalProjectSources="$PROBE_FEED"
          for test in \
            TupleLabelsDoNotChangeTheSharpPackCodecIdentity \
            SharpPackSidecarWireShapeShouldAffectCodecHash \
            SharpPackSidecarsFromIndependentBuildsShouldCrossDecode \
            ExplicitNonSharpPackAdapterShouldWinOverAssemblyRoute \
            UnsupportedNestedConstructionShouldReportBuildTimePathDiagnostic; do
            dotnet test --project "$project" -c Release --no-build \
              --treenode-filter "/*/*/RpcAnalyzerTests/$test"
          done
      - name: Verify the packaged SDK without the optional adapter
        working-directory: sharplink-probe
        run: |
          dotnet build src/SharpLink.Sdk/SharpLink.Sdk.csproj -c Release \
            -p:Version="$SHARPLINK_VERSION" -p:RestoreAdditionalProjectSources="$PROBE_FEED"
          for name in SharpLink.Abstractions SharpLink.Sdk; do
            dotnet pack "src/$name/$name.csproj" -c Release --no-build \
              -p:Version="$SHARPLINK_VERSION" -o "$PROBE_FEED"
          done
          app="$RUNNER_TEMP/standalone-sdk"
          mkdir -p "$app"
          cat > "$app/SdkProbe.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
              <UseSharedCompilation>false</UseSharedCompilation>
              <EmitCompilerGeneratedFiles>true</EmitCompilerGeneratedFiles>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="SharpLink.Sdk" Version="[$SHARPLINK_VERSION]" /></ItemGroup>
          </Project>
          EOF
          echo 'using SharpLink.Sdk; [RpcSerializable] public sealed partial class PlainDto { public int Count { get; set; } }' > "$app/Probe.cs"
          dotnet build "$app/SdkProbe.csproj" -c Release -p:RestoreAdditionalProjectSources="$PROBE_FEED"
          test -n "$(find "$app/obj" -name SharpLink.GeneratedCodecs.g.cs -print -quit)"
          ! grep -q '"SharpPack\(\.\|/\)' "$app/obj/project.assets.json"
      - name: Publish and run the real routed RPC NativeAOT smoke
        working-directory: sharplink-probe
        run: |
          output="$RUNNER_TEMP/sharplink-aot"
          dotnet publish test/SharpLink.SharpPackAotSmoke/SharpLink.SharpPackAotSmoke.csproj \
            -c Release -r linux-x64 -o "$output" -p:RestoreAdditionalProjectSources="$PROBE_FEED"
          "$output/SharpLink.SharpPackAotSmoke"
