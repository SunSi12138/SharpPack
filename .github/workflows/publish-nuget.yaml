name: Publish-NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without a v prefix"
        required: true
        default: "1.0.2"
      nuget_user:
        description: "NuGet.org profile name, not an email address"
        required: true

jobs:
  publish:
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Validate version
        run: |
          project_version=$(sed -n \
            's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' \
            Directory.Build.props)
          test "$project_version" = "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: dotnet build SharpPack.sln -c Release -p:Version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: dotnet test tests/SharpPack.Tests/SharpPack.Tests.csproj -c Release --no-build
      - run: dotnet run --project sandbox/CollectibleAlcSample -c Release
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/sharppack-aot"
      - run: '"$RUNNER_TEMP/sharppack-aot/NativeAot"'
      - run: dotnet list SharpPack.sln package --vulnerable --include-transitive
      - name: Pack
        run: |
          dotnet pack src/SharpPack.Core/SharpPack.Core.csproj -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o ./publish
          dotnet pack src/SharpPack.Generator/SharpPack.Generator.csproj -c Release --no-build -p:Version="$VERSION" -o ./publish
          dotnet pack src/SharpPack.Streaming/SharpPack.Streaming.csproj -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o ./publish
          dotnet pack src/SharpPack/SharpPack.csproj -c Release --no-build -p:Version="$VERSION" -o ./publish
        env:
          VERSION: ${{ inputs.version }}
      - run: git diff --exit-code
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user }}
      - name: Push packages
        run: |
          for package in \
            ./publish/SharpPack.Core.*.nupkg \
            ./publish/SharpPack.Generator.*.nupkg \
            ./publish/SharpPack.Streaming.*.nupkg \
            ./publish/SharpPack.[0-9]*.nupkg
          do
            case "$package" in
              *.symbols.nupkg) continue ;;
            esac
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
