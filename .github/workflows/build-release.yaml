name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: false = create release/nuget. true = never create release/nuget."
        required: true
        default: false
        type: boolean

jobs:
  build-dotnet:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          fetch-depth: 0
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
      - run: dotnet build -c Release -p:Version="$VERSION"
        env:
          VERSION: ${{ inputs.tag }}
      - run: dotnet test -c Release --no-build
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/memorypack-aot"
      - run: '"$RUNNER_TEMP/memorypack-aot/NativeAot"'
      - run: dotnet list MemoryPack.sln package --vulnerable --include-transitive
      - run: dotnet pack -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -o ./publish
        env:
          VERSION: ${{ inputs.tag }}
      - run: git diff --exit-code
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish
          retention-days: 1

  # publish
  publish:
    name: "Publish NuGet packages"
    needs: [build-dotnet]
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
      - uses: Cysharp/Actions/.github/actions/download-artifact@main
      # push nuget
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "./nuget/*.nupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "${NUGET_KEY}"
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # release
  create-release:
    needs: [publish]
    permissions:
      contents: write
      id-token: write # required for NuGet Trusted Publish
    uses: Cysharp/Actions/.github/workflows/create-release.yaml@main
    with:
      dry-run: ${{ inputs.dry-run }}
      commit-id: ${{ github.sha }}
      tag: ${{ inputs.tag }}
      nuget-push: false
      release-upload: false
    secrets: inherit
