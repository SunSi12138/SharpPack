name: Build-Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix, for example 1.0.0"
        required: true

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release -p:Version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet run --project sandbox/CollectibleAlcSample -c Release
      - run: tools/CompatibilityBaseline/generate-original-head-corpus.sh
      - run: dotnet publish sandbox/NativeAot/NativeAot.csproj -c Release -o "$RUNNER_TEMP/sharppack-aot"
      - run: '"$RUNNER_TEMP/sharppack-aot/NativeAot"'
      - run: dotnet list SharpPack.sln package --vulnerable --include-transitive
      - name: Pack
        run: |
          dotnet pack src/SharpPack.Core/SharpPack.Core.csproj -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o ./publish
          dotnet pack src/SharpPack.Generator/SharpPack.Generator.csproj -c Release --no-build -p:Version="$VERSION" -o ./publish
          dotnet pack src/SharpPack.Streaming/SharpPack.Streaming.csproj -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o ./publish
          dotnet pack src/SharpPack/SharpPack.csproj -c Release --no-build -p:Version="$VERSION" -o ./publish
        env:
          VERSION: ${{ inputs.version }}
      - run: git diff --exit-code
      - name: Create GitHub release
        run: >-
          gh release create "v$VERSION" ./publish/*
          --target "$GITHUB_SHA"
          --title "SharpPack $VERSION"
          --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
