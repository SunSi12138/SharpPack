name: Verify-Core-CodeGen

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/codegen.yaml
      - .gitattributes
      - .editorconfig
      - Directory.Build.props
      - SharpPack.sln
      - global.json
      - tools/SharpPack.CodeGen/**
      - src/SharpPack.Core/FormatterResolver.WellKnownTypes.cs
      - src/SharpPack.Core/Formatters/TupleFormatter.cs
      - src/SharpPack.Core/SharpPackReader.Unmanaged.cs
      - src/SharpPack.Core/SharpPackWriter.Unmanaged.cs

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/SharpPack.CodeGen -c Release -- verify
      - run: git diff --exit-code
